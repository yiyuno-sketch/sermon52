<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>말씀과 은혜 - 설교 요약 뷰어</title>
  
  <!-- Pretendard / Noto Sans KR 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent-bg: #eff6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }

    /* 상단 네비게이션 헤더 */
    .app-header {
      background-color: #ffffff;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 14px 20px;
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-logo {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-service {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 9999px;
      background-color: #dbeafe;
      color: #1e40af;
      font-weight: 600;
    }

    /* 본문 레이아웃 */
    .main-wrapper {
      max-width: 900px;
      margin: 28px auto 60px;
      padding: 0 16px;
    }

    /* 메인 카드 */
    .content-card {
      background-color: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      padding: 32px;
      margin-bottom: 24px;
    }

    @media (max-width: 640px) {
      .content-card {
        padding: 20px;
      }
    }

    /* 설교 상단 메타 정보 헤더 */
    .sermon-header {
      margin-bottom: 24px;
    }

    .sermon-category {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .sermon-title {
      font-size: 1.65rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.35;
      margin-bottom: 12px;
    }

    .sermon-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.9rem;
      color: var(--text-muted);
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-color);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 팟캐스트 오디오 다운로드 전용 카드 UI */
    .podcast-download-card {
      background: linear-gradient(to right, #f8fafc, #f1f5f9);
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 18px 22px;
      margin: 22px 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .podcast-info-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .podcast-icon-bubble {
      width: 44px;
      height: 44px;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      flex-shrink: 0;
    }

    .podcast-texts h4 {
      font-size: 0.98rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 2px;
    }

    .podcast-texts p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* 다운로드 버튼 */
    .btn-audio-download {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      background-color: var(--primary);
      color: #ffffff !important;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      transition: all 0.15s ease-in-out;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-audio-download:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    @media (max-width: 600px) {
      .podcast-download-card {
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
        padding: 16px;
      }
      .btn-audio-download {
        justify-content: center;
        width: 100%;
      }
    }

    /* HTML 본문 콘텐츠 래퍼 */
    .sermon-body-html {
      margin-top: 20px;
    }

    /* 묵상 및 적용 섹션 */
    .reflection-box {
      margin-top: 36px;
      padding: 22px;
      background-color: #faf5ff;
      border: 1px solid #e9d5ff;
      border-radius: 12px;
    }

    .reflection-box h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #6b21a8;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reflection-list {
      list-style-type: none;
      padding-left: 0;
    }

    .reflection-list li {
      position: relative;
      padding-left: 22px;
      margin-bottom: 8px;
      font-size: 0.92rem;
      color: #4c1d95;
      line-height: 1.6;
    }

    .reflection-list li::before {
      content: "✔";
      position: absolute;
      left: 0;
      color: #9333ea;
      font-size: 0.85rem;
    }

    /* 하단 푸터 */
    .app-footer {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <!-- 헤더 네비게이션 -->
  <header class="app-header">
    <div class="header-container">
      <div class="app-logo">
        <span>📖</span>
        <span>설교 요약 뷰어</span>
      </div>
      <span class="badge-service" id="headerDateBadge">2026-10-14</span>
    </div>
  </header>

  <!-- 메인 본문 컨테이너 -->
  <main class="main-wrapper">
    <article class="content-card">
      
      <!-- 설교 기본 정보 -->
      <header class="sermon-header">
        <span class="sermon-category" id="sermonType">수요예배</span>
        <h1 class="sermon-title" id="sermonTitle">한눈에 이해하는 마태복음 팔복(八福) 총정리</h1>
        
        <div class="sermon-meta-row">
          <div class="meta-item">
            <span>📅</span> <span id="sermonDate">2026년 10월 14일</span>
          </div>
          <div class="meta-item">
            <span>👤</span> <span id="sermonPreacher">한성찬 담임목사</span>
          </div>
          <div class="meta-item">
            <span>📜</span> <span id="sermonBible">마태복음 5:1~12</span>
          </div>
        </div>
      </header>

      <!-- 팟캐스트 오디오 다운로드 전용 UI (웹 재생기 대신 배치) -->
      <section class="podcast-download-card" id="podcastSection">
        <div class="podcast-info-group">
          <div class="podcast-icon-bubble">🎙️</div>
          <div class="podcast-texts">
            <h4>설교 팟캐스트 음원 (MP3/M4A)</h4>
            <p>스트리밍 대신 기기에 다운로드하여 즐겨 쓰는 오디오 플레이어로 청취하세요.</p>
          </div>
        </div>
        
        <a id="btnAudioDownload" 
           href="#" 
           download="마태복음_팔복_총정리.m4a" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="btn-audio-download">
          <span>📥</span> <span>음원 파일 다운로드</span>
        </a>
      </section>

      <!-- 구글 시트 J열(HTML 요약) 렌더링 영역 -->
      <section class="sermon-body-html" id="sermonBodyHtml">
        <!-- JavaScript에서 동적으로 주입됩니다 -->
      </section>

      <!-- 나눔과 묵상 질문 (L열) -->
      <section class="reflection-box" id="reflectionSection">
        <h3>💭 함께 나누는 묵상 질문</h3>
        <ul class="reflection-list" id="reflectionList">
          <!-- 동적 항목 삽입 -->
        </ul>
      </section>

    </article>

    <footer class="app-footer">
      <p>본 요약은 성도들의 깊은 묵상과 복습을 위해 제공됩니다.</p>
    </footer>
  </main>

  <script>
    /**
     * 구글 드라이브 공유 링크를 브라우저 '직접 다운로드' URL로 변환하는 유틸리티
     */
    function convertToDirectDownloadUrl(url) {
      if (!url) return '';
      
      // 구글 드라이브 패턴 매칭 (/file/d/ID 또는 id=ID)
      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        // 직접 다운로드 엔드포인트 생성
        return `https://drive.google.com/uc?export=download&id=${match[1]}`;
      }
      return url;
    }

    /**
     * 스프레드시트의 레코드 데이터 모형
     * (Google Apps Script API, Google Visualization API 또는 JSON 페치 연동 시 이 객체에 바인딩)
     */
    const sermonData = {
      title: "한눈에 이해하는 마태복음 팔복(八福) 총정리",
      type: "수요예배",
      date: "2026-10-14",
      preacher: "한성찬 담임목사",
      bible_ref: "마태복음 5:1~12",
      // 구글 드라이브 음원 링크 예시
      audio_url: "https://drive.google.com/file/d/1U9neX7KWHRXS115b7mLTNQw_qRgaAxr7/view?usp=sharing",
      // 구글 시트 J2 셀에 들어간 P4 스타일의 HTML 소스
      content_html: `
        <div style="font-family: 'Noto Sans KR', sans-serif; line-height: 1.8; color: #334155; word-break: keep-all;">
          <div style="margin-bottom: 22px; padding: 14px 18px; background-color: #f1f5f9; border-radius: 8px; border-left: 4px solid #64748b; font-size: 14.5px;">
            <p style="margin: 3px 0;"><strong>• 설교 출처:</strong> 월내교회 수요예배 (2026년 10월 14일) / 한성찬 담임목사</p>
            <p style="margin: 3px 0;"><strong>• 본문 말씀:</strong> 마태복음 5장 1절 ~ 12절 (팔복 총정리)</p>
          </div>

          <div style="margin-bottom: 24px; padding: 20px; background-color: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; border-left: 4px solid #3b82f6;">
            <h2 style="font-size: 18px; font-weight: bold; color: #1e40af; margin-top: 0; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #cbd5e1;">
              1. 서론: 성경이 말하는 진짜 ‘복’과 팔복의 핵심 주제
            </h2>
            <p style="margin: 8px 0; font-size: 14.5px;">
              성경은 창세기 1장 28절로 시작하여 요한계시록 22장 14절로 끝나는 <strong>‘복의 책’</strong>입니다. 성경이 말하는 참된 복은 물질이나 건강의 성공만을 의미하는 기복주의가 아니라, <span style="color: #2563eb; font-weight: bold;">하나님과의 바른 관계 안에서 누리는 내적인 평안, 만족, 안식</span>입니다.
            </p>
            <table style="width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13.5px; background-color: #ffffff; border: 1px solid #cbd5e1;">
              <thead>
                <tr style="background-color: #eff6ff; border-bottom: 2px solid #bfdbfe;">
                  <th style="width: 30%; padding: 10px; font-weight: bold; text-align: center; color: #1e3a8a; border-right: 1px solid #cbd5e1;">핵심 개념</th>
                  <th style="width: 70%; padding: 10px; font-weight: bold; text-align: left; color: #1e3a8a;">설교 핵심 내용</th>
                </tr>
              </thead>
              <tbody>
                <tr style="border-bottom: 1px solid #e2e8f0;">
                  <td style="padding: 10px; text-align: center; font-weight: bold; border-right: 1px solid #e2e8f0;">‘천국’의 의미</td>
                  <td style="padding: 10px;">유대인은 거룩한 하나님의 이름을 ‘하늘’로 대체했습니다. 따라서 천국은 <strong>‘하나님의 나라(통치와 다스림)’</strong>를 뜻합니다.</td>
                </tr>
                <tr>
                  <td style="padding: 10px; text-align: center; font-weight: bold; border-right: 1px solid #e2e8f0;">수미쌍관 구조</td>
                  <td style="padding: 10px;">1번째 복과 8번째 복은 동일하게 “천국이 그들의 것임이요”로 끝맺으며, 현재 이 땅에서부터 주님의 다스림을 누리는 복임을 보여줍니다.</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div style="margin-bottom: 24px; padding: 20px; background-color: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; border-left: 4px solid #10b981;">
            <h2 style="font-size: 18px; font-weight: bold; color: #047857; margin-top: 0; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #cbd5e1;">
              2. 제1복 ~ 제4복: 영적 파산에서 배부름까지
            </h2>
            <p style="font-size: 14px; margin-bottom: 10px;">자신의 영적 무능함을 고백하고 주님의 의를 사모하는 내적 변화의 단계입니다.</p>
            <ul style="padding-left: 20px; font-size: 14px;">
              <li><strong>심령이 가난한 자:</strong> 영적 파산자임을 깨닫고 주님의 은혜만 간절히 구하는 자</li>
              <li><strong>애통하는 자:</strong> 자신의 죄성과 이웃의 아픔을 품고 주께 매달릴 때 임하는 위로</li>
              <li><strong>온유한 자:</strong> 성령과 말씀에 의해 길들여지고 통제된 성품</li>
              <li><strong>의에 주리고 목마른 자:</strong> 어린양 예수님의 다스림을 받아 누리는 영혼의 참된 만족</li>
            </ul>
          </div>

          <div style="margin-bottom: 24px; padding: 20px; background-color: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; border-left: 4px solid #8b5cf6;">
            <h2 style="font-size: 18px; font-weight: bold; color: #6d28d9; margin-top: 0; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #cbd5e1;">
              3. 제5복 ~ 제8복: 이웃을 향한 성품과 고난을 이기는 신앙
            </h2>
            <p style="font-size: 14px; margin-bottom: 10px;">믿음이 삶으로 표현되며 이웃과 세상을 향해 뻗어나가는 성도의 삶입니다.</p>
            <ul style="padding-left: 20px; font-size: 14px;">
              <li><strong>긍휼히 여기는 자:</strong> 선한 사마리아인처럼 구체적인 행동으로 이웃을 돕는 품이 넓은 신앙</li>
              <li><strong>마음이 청결한 자:</strong> 마음에 두 마음을 품지 않고 주님만 바라봄으로 하나님을 깊이 아는 삶</li>
              <li><strong>화평하게 하는 자:</strong> 분쟁을 막고 관계를 회복시키는 화목의 사명자</li>
              <li><strong>박해를 받은 자:</strong> 의와 복음을 위해 받는 고난을 부끄러워하지 않고 기쁨과 상급으로 여기는 신앙</li>
            </ul>
          </div>

          <div style="padding: 18px; background-color: #fffbeb; border: 1px solid #fde68a; border-left: 5px solid #f5960b; border-radius: 8px;">
            <h3 style="font-size: 16px; font-weight: bold; color: #92400e; margin-top: 0; margin-bottom: 8px;">
              💡 결론: 팔복의 주인공이신 예수님을 닮아가는 삶
            </h3>
            <p style="margin: 0; font-size: 14px; color: #78350f;">
              팔복은 성도 개인뿐 아니라 <strong>교회 공동체</strong>가 함께 살아내야 할 은혜의 모범입니다. 내 힘이 아닌 성령님의 도우심으로 주님을 닮아가는 복된 공동체가 됩시다.
            </p>
          </div>
        </div>
      `,
      reflection_points: [
        "나는 매일 하나님 앞에서 영적 파산자의 겸손함으로 주님의 은혜를 구하고 있습니까?",
        "신앙의 연륜이 쌓일수록 다른 사람을 품어주는 긍휼의 그릇이 넓어지고 있습니까?",
        "가정과 일터, 교회 안에서 평화를 만드는 화목의 직분을 어떻게 실천할 수 있습니까?"
      ]
    };

    /**
     * 화면 렌더링 초기화
     */
    function initView(data) {
      // 1. 헤더 및 메타데이터 바인딩
      document.getElementById('headerDateBadge').textContent = data.date;
      document.getElementById('sermonType').textContent = data.type;
      document.getElementById('sermonTitle').textContent = data.title;
      document.getElementById('sermonDate').textContent = data.date;
      document.getElementById('sermonPreacher').textContent = data.preacher;
      document.getElementById('sermonBible').textContent = data.bible_ref;

      // 2. 오디오 다운로드 버튼 제어
      const downloadBtn = document.getElementById('btnAudioDownload');
      const podcastCard = document.getElementById('podcastSection');

      if (data.audio_url) {
        const directUrl = convertToDirectDownloadUrl(data.audio_url);
        downloadBtn.href = directUrl;
        
        // 다운로드 파일명 동적 지정
        const safeTitle = data.title.replace(/\s+/g, '_').substring(0, 30);
        downloadBtn.setAttribute('download', `${safeTitle}_음원.m4a`);
      } else {
        // 음원 주소가 없을 경우 버튼 비활성화 처리
        podcastCard.style.display = 'none';
      }

      // 3. 스프레드시트 J열의 HTML 콘텐츠 주입
      document.getElementById('sermonBodyHtml').innerHTML = data.content_html;

      // 4. 나눔 질문 리스트 바인딩
      const reflectionListEl = document.getElementById('reflectionList');
      reflectionListEl.innerHTML = '';
      if (data.reflection_points && data.reflection_points.length > 0) {
        data.reflection_points.forEach(point => {
          const li = document.createElement('li');
          li.textContent = point;
          reflectionListEl.appendChild(li);
        });
      } else {
        document.getElementById('reflectionSection').style.display = 'none';
      }
    }

    // 페이지 로드 시 렌더링 실행
    window.addEventListener('DOMContentLoaded', () => {
      initView(sermonData);
    });
  </script>
</body>
</html>
